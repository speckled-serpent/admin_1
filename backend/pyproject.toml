[project]
name = "admin1"
version = "0.1.0"
description = "Local-first admin panel skeleton for a user's software projects."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
# Pyflakes and pycodestyle errors. Import sorting and pyupgrade rewrites are
# not enabled; those would touch generated migrations and most modules.
select = ["E", "F"]
ignore = ["E501"]
